schema_version: 1

context:
  name: jupyterlab_commands
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 210c851ee4c7439ac593018542c599a9085e459bc1bc1fb3ea92d2a9bf3e11ff

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - nodejs >=16
    - yarn
    - hatchling
    - hatch-jupyter-builder
    - jupyterlab >=4,<5
  run:
    - python >=${{ python_min }}
    - jupyterlab >=4,<5

tests:
  - python:
      imports:
        - jupyterlab_commands
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Arbitrary python commands for notebooks in JupyterLab
  description: |
    Arbitrary python commands for notebooks in JupyterLab
  homepage: http://github.com/timkpaine/jupyterlab_commands
  repository: https://github.com/timkpaine/jupyterlab_commands

extra:
  recipe-maintainers:
    - timkpaine
